name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      payload_artifact:
        type: string
        default: ''
      release_version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.payload_artifact != ''
        with:
          name: ${{ inputs.payload_artifact }}
          path: /tmp/release-payload
      - name: Verify source matches staged distribution
        if: inputs.payload_artifact != ''
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, pathlib
          root = pathlib.Path('/tmp/release-payload')
          expected = json.loads((root / 'evidence/files.json').read_text())
          payload = root / 'stage/joshternet'
          actual = {p.relative_to(payload).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in payload.rglob('*') if p.is_file()}
          assert actual == expected, 'Staged artifact differs from manifest'
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          PYTHON
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer phpcs

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wp: '6.0'
          - php: '7.4'
            wp: '7.1.3'
          - php: '8.2'
            wp: '7.1.3'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.payload_artifact != ''
        with:
          name: ${{ inputs.payload_artifact }}
          path: /tmp/release-payload
      - name: Verify source matches staged distribution
        if: inputs.payload_artifact != ''
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, pathlib
          root = pathlib.Path('/tmp/release-payload')
          expected = json.loads((root / 'evidence/files.json').read_text())
          payload = root / 'stage/joshternet'
          actual = {p.relative_to(payload).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in payload.rglob('*') if p.is_file()}
          assert actual == expected, 'Staged artifact differs from manifest'
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          PYTHON
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion
      - run: composer install --no-progress --prefer-dist
      - name: Install WordPress test library
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 ${{ matrix.wp }}
      - run: composer test
      - name: PHPUnit Multisite
        run: composer test:multisite

  plugin-check:
    if: inputs.payload_artifact != ''
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_check
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.payload_artifact }}
          path: release-payload
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          tools: wp-cli:2.12.0
      - name: Install explicit WordPress and Plugin Check versions
        shell: bash
        run: |
          set -euo pipefail
          wp core download --version=7.1.3 --path=/tmp/wordpress-check
          wp config create --path=/tmp/wordpress-check --dbname=wordpress_check \
            --dbuser=root --dbpass='' --dbhost=127.0.0.1
          # Ephemeral CI installation; this password is never used externally.
          wp core install --path=/tmp/wordpress-check --url=http://localhost \
            --title='Release check' --admin_user=release-check \
            --admin_password=ephemeral-release-check --admin_email=check@example.invalid --skip-email
          test "$(wp core version --path=/tmp/wordpress-check)" = 7.1.3
          cp -R release-payload/stage/joshternet /tmp/wordpress-check/wp-content/plugins/joshternet
          wp plugin install plugin-check --version=2.1.0 --activate --path=/tmp/wordpress-check
          wp plugin activate joshternet --path=/tmp/wordpress-check
      - name: Plugin Check including readme validation; warnings block publishing
        shell: bash
        run: |
          set -euo pipefail
          # Defaults include errors and warnings and exclude experimental checks.
          wp plugin check joshternet --slug=joshternet --format=strict-json \
            --path=/tmp/wordpress-check \
            --require=/tmp/wordpress-check/wp-content/plugins/plugin-check/cli.php \
            > release-payload/evidence/plugin-check-results.txt
          python3 bin/release-tools.py plugin-check-results release-payload/evidence/plugin-check-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-check-evidence
          path: release-payload/evidence/plugin-check-results.txt
          if-no-files-found: warn

  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build fixture and run release safety tests
        run: |
          bash bin/build-dist-zip.sh
          python3 tests/test-release-tools.py
